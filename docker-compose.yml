x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://admin:ige_dev_password@postgres:5432/intel_graph_db}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-only-change-before-deployment}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8443}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8443}
  STORAGE_PROVIDER: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
  MINIO_BUCKET: evidence
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ige_dev_password}
  BLOCKCHAIN_BRIDGE_URL: http://blockchain-bridge:8787

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intel_graph_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ige_dev_password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d intel_graph_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ige_dev_password}
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123}; do sleep 2; done; mc mb --ignore-existing local/evidence; mc mb --ignore-existing local/exports"
    depends_on:
      minio: { condition: service_healthy }

  hardhat:
    image: node:22-alpine
    working_dir: /chain
    command: sh -c "npm ci && npm run node"
    volumes: ["./blockchain:/chain", "hardhat_modules:/chain/node_modules"]
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      start_period: 60s
      interval: 5s
      timeout: 3s
      retries: 30

  blockchain-deploy:
    image: node:22-alpine
    working_dir: /chain
    command: sh -c "npm ci && npm run compile && npm run deploy"
    environment:
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
    volumes: ["./blockchain:/chain", "deploy_modules:/chain/node_modules"]
    depends_on:
      hardhat: { condition: service_healthy }

  blockchain-bridge:
    image: node:22-alpine
    working_dir: /chain
    command: sh -c "npm ci && npm run bridge"
    environment:
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      CONTRACT_DEPLOYMENT_PATH: ./deployment/local.json
    volumes: ["./blockchain:/chain", "bridge_modules:/chain/node_modules"]
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      blockchain-deploy: { condition: service_completed_successfully }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      blockchain-bridge: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.worker
    environment: *backend-env
    volumes: ["./data:/app/data"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PORT: 8443
      VITE_APP_MODE: full
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["8443:8443"]
    # This is the local judging/development service. Keep dependencies in the
    # image, but load audited source changes without another image download.
    volumes: ["./src:/app/src:ro", "./public:/app/public:ro"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres_data:
  neo4j_data:
  minio_data:
  hardhat_modules:
  deploy_modules:
  bridge_modules:
